<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mat Log" />
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)" />
<meta name="description" content="Personal BJJ training log" />
<title>Mat Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">Mat<span class="dot">.</span>Log</div>
    <div class="header-right">
      <button class="belt-badge" id="beltBadge" data-act="settings" aria-label="Belt and settings"></button>
      <button class="icon-btn" data-act="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="screen" id="screen-home"></section>
    <section class="screen" id="screen-log"></section>
    <section class="screen" id="screen-skills"></section>
    <section class="screen" id="screen-review"></section>
    <section class="screen" id="screen-progress"></section>
  </main>
</div>

<nav class="tabs" aria-label="Main">
  <button data-act="tab" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
  <button data-act="tab" data-tab="log">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2v4M16 2v4M4 10h16M8 14h3M8 17h6"/></svg>Log</button>
  <button class="fab" data-act="log-new" aria-label="Log a session">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="tab" data-tab="skills">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Skills</button>
  <button data-act="tab" data-tab="review">
    <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Review</button>
</nav>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip"></div>

<script src="js/data.js?v=3"></script>
<script src="js/store.js?v=3"></script>
<script src="js/analytics.js?v=3"></script>
<script src="js/charts.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/screens.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
